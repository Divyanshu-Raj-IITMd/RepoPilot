[project]
name = "repopilot-backend"
version = "0.1.0"
description = "RepoPilot — agentic AI software engineering assistant (backend)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "UP035", "UP006"]

[tool.ruff.lint.per-file-ignores]
"app/parsing/heuristic.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
