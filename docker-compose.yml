services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REPOPILOT_LLM_PROVIDER: ${REPOPILOT_LLM_PROVIDER:-auto}
      OLLAMA_URL: http://ollama:11434
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Docker-in-Docker is not available by default; executors run subprocess
      # mode inside this container. Mount the host socket to enable the Docker
      # sandbox executor:
      #   REPOPILOT_EXECUTOR: docker
    volumes:
      - repopilot-data:/app/.repopilot
      # - /var/run/docker.sock:/var/run/docker.sock

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  # Optional: Qdrant as an alternative vector store
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports: ["6333:6333"]
  #   volumes: [qdrant-data:/qdrant/storage]

volumes:
  repopilot-data:
  ollama-models:
  # qdrant-data:
